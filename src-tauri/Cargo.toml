[package]
name = "GithubSecurityAlerts"
version = "1.3.6"
description = "Github Security Alerts"
authors = ["stephanebouget"]
license = ""
repository = ""
default-run = "GithubSecurityAlerts"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "^2.7.6", features = [] }
dotenv = "^0.15.0"

[dependencies]
tauri = { version = "^2.12.7", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "^2.6.0"
tauri-plugin-updater = "^2.14.1"
tauri-plugin-notification = "^2.8.1"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
reqwest = { version = "^0.13.5", default-features = false, features = ["json", "form", "query", "native-tls-no-alpn", "charset", "http2", "system-proxy"] }
tokio = { version = "^1.54.1", features = ["full"] }
image = "^0.25.10"
open = "^5.4.5"
tiny_http = "^0.12.0"
url = "^2.5.9"
dirs = "^7.0.0"
dotenv = "^0.15.0"
tauri-plugin-single-instance = "^2.5.5"
tauri-plugin-autostart = "^2.7.0"
urlencoding = "^2.1.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
